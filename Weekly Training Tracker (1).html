<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Training Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--text:#14181f;--muted:#6b7280;--track:#e5e7eb;--accent:#2563eb;--done:#16a34a;--btn:#eef0f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#1a1f29;--text:#f1f3f7;--muted:#98a1b0;--track:#2c3341;--accent:#60a5fa;--done:#4ade80;--btn:#262d3a}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#1a1f29;--text:#f1f3f7;--muted:#98a1b0;--track:#2c3341;--accent:#60a5fa;--done:#4ade80;--btn:#262d3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.weeks button{flex:none;border:0;background:var(--btn);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px}
.weeks button.on{background:var(--accent);color:#fff}
.hero{background:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hero b{font-size:17px;display:block}.hero span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center}
.card.ok{outline:2px solid var(--done)}
.name{font-size:13px;font-weight:600;min-height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ico{height:30px;font-size:24px;line-height:30px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.ico svg{width:30px;height:30px}
.ring{position:relative;width:96px;height:96px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.ring .c small{font-size:11px;color:var(--muted);font-weight:500}
.ctl{display:flex;justify-content:center;gap:12px;margin-top:10px}
.ctl button{width:44px;height:36px;border:0;border-radius:10px;background:var(--btn);color:var(--text);font-size:20px}
.ctl button.plus{background:var(--accent);color:#fff}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;border:0;background:var(--btn);color:var(--text);padding:10px;border-radius:12px;font-size:14px}
.tgt{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.tgt button{width:28px;height:24px;border:0;border-radius:6px;background:var(--btn);color:var(--text)}
</style>
</head>
<body>
<h1>🏋️ Weekly Training Tracker</h1>
<div class="weeks" id="weeks"></div>
<div class="hero" id="hero"></div>
<div class="grid" id="grid"></div>
<div class="row"><button id="edit"></button><button id="reset">Reset week</button></div>
<script>
const NAMES=["Lift – Legs","Lift – Chest/Triceps","Lift – Back/Biceps","Speed Work","Throwing/Long Toss","Fielding","Hitting","Football Toss"];
const W1=[2,1,1,2,0,2,3,2];
const DB='<svg viewBox="0 0 32 32" fill="currentColor"><rect x="1" y="11" width="3" height="10" rx="1"/><rect x="5" y="7" width="4" height="18" rx="1.5"/><rect x="9" y="14.5" width="14" height="3"/><rect x="23" y="7" width="4" height="18" rx="1.5"/><rect x="28" y="11" width="3" height="10" rx="1"/></svg>';
const BAT='<svg viewBox="0 0 32 32" fill="currentColor"><g transform="rotate(45 16 16)"><rect x="13" y="1" width="6" height="18" rx="3"/><rect x="15" y="18" width="2" height="10"/><rect x="13.5" y="28" width="5" height="3" rx="1.5"/></g></svg>';
const GLOVE='<svg viewBox="0 0 32 32" fill="currentColor"><rect x="6" y="3" width="4" height="14" rx="2"/><rect x="10.5" y="1" width="4" height="16" rx="2"/><rect x="15" y="2" width="4" height="15" rx="2"/><rect x="19.5" y="5" width="4" height="13" rx="2"/><rect x="4" y="11" width="21" height="17" rx="7"/><rect x="0.5" y="14" width="8" height="5" rx="2.5" transform="rotate(35 4 16)"/><circle cx="15" cy="20" r="4" fill="none" stroke="var(--card)" stroke-width="1.6"/></svg>';
const ICONS=[DB,DB,DB,'👟','⚾',GLOVE,BAT,'🏈'];
const KEY="weekly-tracker-v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.weeks)S={cur:0,weeks:[{req:W1.slice(),done:NAMES.map(()=>0)}]};
const THROW=4,THROW_FROM=4; // Throwing becomes required after week 4 (week 5 on)
if(!S.m){S.weeks.forEach((w,i)=>{if(i>=THROW_FROM&&w.req[THROW]===0)w.req[THROW]=1});S.m=1}
let editing=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ring(p,col,r=40){const c=2*Math.PI*r;return `<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--track)" stroke-width="9"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="transition:stroke-dashoffset .4s"/></svg>`}
function render(){
 const w=S.weeks[S.cur];
 document.getElementById("weeks").innerHTML=S.weeks.map((_,i)=>`<button class="${i==S.cur?'on':''}" onclick="S.cur=${i};save();render()">Week ${i+1}</button>`).join("")+`<button onclick="addWeek()">+ Week</button>`;
 let tot=0,got=0;
 w.req.forEach((r,i)=>{tot+=r;got+=Math.min(w.done[i],r)});
 const p=tot?got/tot:0;
 document.getElementById("hero").innerHTML=`<div class="ring">${ring(p,p>=1?'var(--done)':'var(--accent)')}<div class="c">${Math.round(p*100)}%</div></div><div><b>Week ${S.cur+1} progress</b><span>${got} of ${tot} required sessions done</span></div>`;
 document.getElementById("grid").innerHTML=NAMES.map((n,i)=>{
  const r=w.req[i],d=w.done[i],opt=r===0,ok=!opt&&d>=r;
  const pr=opt?(d>0?1:0):Math.min(d/r,1);
  const col=ok?'var(--done)':'var(--accent)';
  return `<div class="card ${ok?'ok':''}"><div class="ico">${ICONS[i]}</div><div class="name">${n}</div><div class="ring">${ring(pr,opt&&d>0?'var(--done)':col)}<div class="c">${ok?'✓':d}<small>${opt?'optional':'of '+r}</small></div></div>
  <div class="ctl"><button onclick="chg(${i},-1)">−</button><button class="plus" onclick="chg(${i},1)">+</button></div>
  ${editing?`<div class="tgt">Target <button onclick="tg(${i},-1)">−</button><b>${r}</b><button onclick="tg(${i},1)">+</button></div>`:''}</div>`}).join("");
 document.getElementById("edit").textContent=editing?"Done editing":"Edit targets";
}
function chg(i,d){const w=S.weeks[S.cur];w.done[i]=Math.max(0,w.done[i]+d);save();render()}
function tg(i,d){const w=S.weeks[S.cur];w.req[i]=Math.max(0,w.req[i]+d);save();render()}
function addWeek(){const l=S.weeks[S.weeks.length-1];const nw={req:l.req.slice(),done:NAMES.map(()=>0)};if(S.weeks.length>=THROW_FROM&&nw.req[THROW]===0)nw.req[THROW]=1;S.weeks.push(nw);S.cur=S.weeks.length-1;save();render()}
document.getElementById("edit").onclick=()=>{editing=!editing;render()};
document.getElementById("reset").onclick=()=>{S.weeks[S.cur].done=NAMES.map(()=>0);save();render()};
render();
</script>
</body>
</html>
